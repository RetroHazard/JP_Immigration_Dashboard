name: 'Fetch e-Stat data'
description: 'Downloads and validates an e-Stat statistics payload, optionally keeping the previous copy for comparison.'

inputs:
  app-id:
    description: 'e-Stat application ID (secrets.ESTAT_APP_ID).'
    required: true
  stats-data-id:
    description: 'e-Stat statsDataId. Defaults to the bureau processing table.'
    required: false
    default: '0003449073'
  path:
    description: 'Destination for the raw payload.'
    required: false
    default: 'public/datastore/processingData.json'
  force:
    description: 'Download even when a copy is already present. When false, an existing file is validated and kept.'
    required: false
    default: 'false'

outputs:
  had-previous:
    description: 'true when a copy already existed before this action ran.'
    value: ${{ steps.fetch.outputs.had-previous }}
  previous-path:
    description: 'Path the pre-existing copy was preserved at (empty when there was none).'
    value: ${{ steps.fetch.outputs.previous-path }}

# A wrapper around scripts/fetch-estat-data.mjs rather than a second
# implementation of it: the paging, merging and row-count assertion all live in
# the script so that CI and a developer run the same code. Hand-rolling the
# paging locally is how a truncated payload reached a working tree.
#
# The script is dependency-free, so this works in the watcher's check-updates
# job, which has no `npm ci`.
runs:
  using: composite
  steps:
    - name: Fetch and validate
      id: fetch
      shell: bash
      # Every input goes through the environment. Nothing is interpolated into
      # the rendered command line — originally so the app ID could not appear
      # there, and now so no input can reach a shell at all.
      env:
        ESTAT_APP_ID: ${{ inputs.app-id }}
        ESTAT_STATS_DATA_ID: ${{ inputs.stats-data-id }}
        ESTAT_OUT_PATH: ${{ inputs.path }}
        ESTAT_FORCE: ${{ inputs.force }}
      run: node "$GITHUB_WORKSPACE/scripts/fetch-estat-data.mjs"
