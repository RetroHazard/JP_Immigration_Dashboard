# Version updates run monthly, grouped so each ecosystem opens at most two pull
# requests a run: one for every minor and patch bump, one for every major. Majors
# are kept apart because they are the ones that need reading before merging.
#
# Security updates are switched on in the repository settings, not here, and open
# as soon as an advisory lands whatever the schedule. The security-updates groups
# only batch them along the same minor/patch vs major line.
#
# Dependabot installs without lifecycle scripts, so npm PRs arrive with the
# lockfile unshaken; dependabot-lockfile.yaml re-shakes it and re-runs verify.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint, which eslint-config-next also depends on, accepts
      # TypeScript below 6.1 only, so 7.x fails `npm ci` on a peer conflict.
      # 6.0.x is still offered. Lift this once typescript-eslint supports 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # Pinned to the Node major in .nvmrc (DEVELOPMENT.md, "Dependency Pinning
      # Strategy"); it moves when the runtime does, not on its own.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
      npm-security-minor-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      npm-security-major:
        applies-to: security-updates
        update-types: [major]

  # `/` covers .github/workflows; composite actions are found by their own directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
