name: CI

# Pull requests only. A `push` trigger here would fire a second, identical run
# for every push to a branch that has a PR open. Pushes to main are verified by
# deploy.yaml, which runs the same checks before publishing.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
