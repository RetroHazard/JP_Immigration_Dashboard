name: Deploy

on:
  # Auto-redeploy when something that actually reaches the built site lands on
  # main. Documentation-only commits (README, ARCHITECTURE, DEVELOPMENT,
  # CONTRIBUTING, LICENSE, issue templates) deliberately do not deploy.
  push:
    branches: [main]
    paths:
      - 'src/**'
      # ...except the docs that live inside it. src/i18n/README.md is the
      # contributor guide to the catalogue, not site content, and `src/**`
      # was quietly deploying on it. Patterns are evaluated in order and the
      # last match wins, so this has to follow the rule it narrows. Root
      # CHANGELOG.md is unaffected — it is listed below and does deploy,
      # because sync-changelog.js copies it into the built site.
      - '!src/**/*.md'
      - 'public/**'
      # Also covers scripts/datasets.mjs, so registering a dataset redeploys.
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      # scripts/sync-changelog.js copies this into public/ for the changelog modal.
      - 'CHANGELOG.md'
      - '.nvmrc'
      - '.github/actions/**'
      - '.github/workflows/deploy.yaml'
      - '.github/workflows/verify.yaml'
  workflow_dispatch:
  # Called by watcher.yaml when e-Stat publishes new figures.
  workflow_call:
    inputs:
      skip-verify:
        description: >-
          Skip lint, typecheck and test before publishing. The watcher passes
          true: on a data-only deploy the code is the commit that already passed
          them on its way into main, and none of the three read data.

          Phrased as skip- rather than run- deliberately. `inputs` is null on a
          push or dispatch, and GitHub's loose equality casts both null and false
          to 0 — so `inputs.run-verify != false` is *false* on a push, which
          would silently skip the checks on the one path that most needs them.
          A default-false flag read with `!` never makes that comparison: null is
          simply falsy.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !inputs.skip-verify }}
    uses: ./.github/workflows/verify.yaml
    with:
      # The deploy job below builds against the real cached payloads, so
      # building the fixture here as well would be wasted work.
      skip-build: true
      # Lockfile dev flags do not affect the built output, so drift should
      # block a pull request, not a publish.
      skip-lockfile-check: true

  deploy:
    needs: verify
    # `needs` on a skipped job resolves to 'skipped', which is not success, so
    # the default `needs` gate would skip this too. Publish when verify passed
    # or was deliberately turned off; never when it failed.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    # Headroom for the fetch's worst-case retry budget on top of install, build
    # and publish, so a legitimate retry is never cut short by the job timeout.
    timeout-minutes: 30

    # Serialise deployments without cancelling one that is already publishing —
    # interrupting actions/deploy-pages can leave the site partially updated.
    # Declared at job level so it applies identically on push, dispatch and
    # workflow_call.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Read-only: watcher.yaml owns writing this cache. The primary key is
      # deliberately unique so it always misses and falls through to the
      # restore-key prefix, which resolves to the most recently saved payload.
      # One entry covers the whole datastore, so a deploy can never pair a fresh
      # copy of one table with a stale copy of another.
      - name: Restore e-Stat data
        uses: actions/cache/restore@v6
        with:
          path: public/datastore
          key: estat-data-${{ github.run_id }}
          restore-keys: |
            estat-data-

      # Downloads only what the cache did not supply; anything already present is
      # validated and kept. Every dataset in scripts/datasets.mjs, so this step
      # never needs editing.
      - name: Ensure e-Stat data
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: node scripts/fetch-estat-data.mjs --all

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Upload build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
