name: Deploy

on:
  # Auto-redeploy when something that actually reaches the built site lands on
  # main. Documentation-only commits (README, ARCHITECTURE, DEVELOPMENT,
  # CONTRIBUTING, LICENSE, issue templates) deliberately do not deploy.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      # scripts/sync-changelog.js copies this into public/ for the changelog modal.
      - 'CHANGELOG.md'
      - '.nvmrc'
      - '.github/actions/**'
      - '.github/workflows/deploy.yaml'
      - '.github/workflows/verify.yaml'
  workflow_dispatch:
  # Called by watcher.yaml when e-Stat publishes new figures.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # run-build: false — the deploy job below builds against the real cached
    # payload, so building the fixture here as well would be wasted work.
    uses: ./.github/workflows/verify.yaml
    with:
      run-build: false
      # Lockfile dev flags do not affect the built output, so drift should
      # block a pull request, not a publish.
      check-lockfile: false

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Serialise deployments without cancelling one that is already publishing —
    # interrupting actions/deploy-pages can leave the site partially updated.
    # Declared at job level so it applies identically on push, dispatch and
    # workflow_call.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Read-only: watcher.yaml owns writing this cache. The primary key is
      # deliberately unique so it always misses and falls through to the
      # restore-key prefix, which resolves to the most recently saved payload.
      - name: Restore e-Stat data
        uses: actions/cache/restore@v6
        with:
          path: public/datastore/statData.json
          key: estat-data-${{ github.run_id }}
          restore-keys: |
            estat-data-

      # Downloads only if the cache produced nothing; otherwise just validates.
      - name: Ensure e-Stat data
        uses: ./.github/actions/fetch-estat-data
        with:
          app-id: ${{ secrets.ESTAT_APP_ID }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Upload build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
