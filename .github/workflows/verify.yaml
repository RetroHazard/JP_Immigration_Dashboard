name: Verify

# The quality gate, both as a pull request's own check and as the step
# deploy.yaml runs before it publishes — so the same checks guard both paths.
#
# Pull requests only, never `push`: a push trigger would fire a second, identical
# run for every push to a branch that has a PR open. Pushes to main are verified
# by deploy.yaml, which calls this workflow.
# Both inputs are phrased as skip- with a default of false, and read with `!`.
# The `inputs` context is null on a `pull_request` — a workflow_call default does
# not apply to an event that is not a workflow_call — and GitHub's loose equality
# casts both null and false to 0, so `inputs.run-build` and
# `inputs.run-build != false` are each false on a pull request. Either phrasing
# would quietly drop these two steps from the one run that most needs them.
# `!null` is simply true, with no cross-type cast in play.
on:
  pull_request:
  workflow_call:
    inputs:
      skip-build:
        description: >-
          Skip the fixture production build. Callers that perform a real build
          against the cached e-Stat payload afterwards pass true, to avoid
          building the site twice in one run.
        type: boolean
        required: false
        default: false
      skip-lockfile-check:
        description: >-
          Skip the check that package-lock.json is in its shaken state. Worth
          gating a pull request on; not worth blocking a deploy, since the dev
          flags do not affect the built output.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# On a pull request, supersede the previous run for that PR. On a workflow_call
# the PR number is empty and the group falls back to the run id, which is unique
# — so a deploy's verify gets its own group and can never be cancelled by
# unrelated pull request activity.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # npm recomputes the lockfile's dev flags on every `npm install`, undoing
      # the 64 that lockfile-shaker sets. The postinstall hook re-applies them,
      # but anything that bypasses lifecycle scripts — `npm install
      # --ignore-scripts`, or Dependabot regenerating the lockfile — silently
      # reverts it. The shaker is idempotent and runs in ~0.3s against the
      # already-installed node_modules, so re-running it and diffing catches
      # that without paying for a second install.
      - name: Check lockfile is shaken
        if: ${{ !inputs.skip-lockfile-check }}
        run: |
          node node_modules/lockfile-shaker/lib/bin.js
          git diff --exit-code package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json is not in its shaken state. Run 'npm install' locally and commit the resulting package-lock.json."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds against the deterministic fixture (no e-Stat secret needed);
      # scripts/transform-data.mts generates it when raw data is absent.
      - name: Build
        if: ${{ !inputs.skip-build }}
        run: npm run build
