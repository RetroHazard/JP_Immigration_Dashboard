name: Verify

# The quality gate for pull requests, and the check deploy.yaml runs before it
# publishes. Pull requests only, never `push`: a push trigger would duplicate the
# run for every push to a branch with an open PR, and deploy.yaml verifies main.
# workflow_dispatch is for dependabot-lockfile.yaml: its push is made with
# GITHUB_TOKEN and starts no run, so it dispatches this one on the new head.
#
# Inputs are phrased skip- with default false and read with `!`: `inputs` is null
# on a `pull_request` or a dispatch (workflow_call defaults don't apply), and
# GitHub's loose equality casts null and false to 0, so a run- input would drop
# these steps from PR runs. `!null` is simply true.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-build:
        description: >-
          Skip the fixture production build. Callers that perform a real build
          against the cached e-Stat payload afterwards pass true, to avoid
          building the site twice in one run.
        type: boolean
        required: false
        default: false
      skip-lockfile-check:
        description: >-
          Skip the check that package-lock.json is in its shaken state. Worth
          gating a pull request on; not worth blocking a deploy, since the dev
          flags do not affect the built output.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# On a pull request, supersede the PR's previous run. On a workflow_call the
# group falls back to the unique run id, so PR activity never cancels a deploy's
# verify.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # npm recomputes the lockfile's dev flags on every `npm install`, undoing
      # lockfile-shaker's. The postinstall hook re-applies them, but anything
      # that skips lifecycle scripts (`--ignore-scripts`, Dependabot) reverts
      # them silently. The shaker is idempotent and fast against the installed
      # node_modules, so re-running it and diffing catches that. On Dependabot's
      # npm PRs, dependabot-lockfile.yaml pushes the fix.
      - name: Check lockfile is shaken
        if: ${{ !inputs.skip-lockfile-check }}
        run: |
          node node_modules/lockfile-shaker/lib/bin.js
          git diff --exit-code package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json is not in its shaken state. Run 'npm install' locally and commit the resulting package-lock.json."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds against the deterministic fixture (no e-Stat secret needed);
      # scripts/transform-data.mts generates it when raw data is absent.
      - name: Build
        if: ${{ !inputs.skip-build }}
        run: npm run build
