name: Verify

# Reusable quality gate. Called by ci.yaml on pull requests and by deploy.yaml
# before it publishes, so the same checks guard both paths.
on:
  workflow_call:
    inputs:
      run-build:
        description: >-
          Run the fixture production build. Callers that perform a real build
          against the cached e-Stat payload afterwards should pass false to
          avoid building the site twice in one run.
        type: boolean
        required: false
        default: true
      check-lockfile:
        description: >-
          Fail if package-lock.json is not in its shaken state. Worth gating a
          pull request on; not worth blocking a deploy, since the dev flags do
          not affect the built output.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # npm recomputes the lockfile's dev flags on every `npm install`, undoing
      # the 64 that lockfile-shaker sets. The postinstall hook re-applies them,
      # but anything that bypasses lifecycle scripts — `npm install
      # --ignore-scripts`, or Dependabot regenerating the lockfile — silently
      # reverts it. The shaker is idempotent and runs in ~0.3s against the
      # already-installed node_modules, so re-running it and diffing catches
      # that without paying for a second install.
      - name: Check lockfile is shaken
        if: ${{ inputs.check-lockfile }}
        run: |
          node node_modules/lockfile-shaker/lib/bin.js
          git diff --exit-code package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json is not in its shaken state. Run 'npm install' locally and commit the resulting package-lock.json."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds against the deterministic fixture (no e-Stat secret needed);
      # scripts/transform-data.mts generates it when raw data is absent.
      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build
