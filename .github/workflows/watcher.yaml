name: Data Watcher

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:05 UTC (10:05 JST). The daily restore also bumps the cache's
    # last-accessed time, which is what keeps it from being evicted.
    - cron: '5 1 * * *'

# Not cancel-in-progress: this workflow's deploy job publishes to Pages, and
# cancelling the run mid-publish would interrupt it. A daily cron never needs
# pre-emption anyway.
concurrency:
  group: watcher
  cancel-in-progress: false

# Least privilege by job rather than workflow-wide. A called workflow can never
# hold more permissions than its caller, but the ceiling is the *calling job's*
# permissions, so pages/id-token belong on the deploy job below rather than here.
permissions:
  contents: read

jobs:
  # What e-Stat publishes is read by scripts/estat-watch.mjs, which probes each
  # dataset in scripts/datasets.mjs, compares against the baseline restored from
  # the cache, and downloads the payloads only when something actually moved.
  # Nothing here names a dataset: adding one is a manifest edit, not a YAML edit.
  check-updates:
    runs-on: ubuntu-latest
    # Above the fetch's worst-case retry budget (4 attempts x 300s, per page),
    # so the job timeout stays an outer backstop rather than cutting a legitimate
    # retry short. Only reachable on a day when data actually moved; a probe-only
    # run finishes in seconds.
    timeout-minutes: 20

    # No `actions: write` here. Pruning needs it; probing a third-party API does
    # not, so the two live in different jobs.
    permissions:
      contents: read

    outputs:
      changed: ${{ steps.watch.outputs.changed }}
      save: ${{ steps.watch.outputs.save }}
      cache-key: ${{ steps.watch.outputs.cache-key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node only — no `npm ci`. scripts/estat-watch.mjs and its imports are
      # dependency-free, and this job never builds. The version still comes from
      # .nvmrc rather than the runner image, so it cannot drift from the deploy's.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The whole datastore directory is the unit of caching, rather than a list
      # of files that has to be kept in sync with the manifest by hand. It holds
      # every raw payload plus .estat-baseline.json, so the record of what was
      # last published can never be restored without the data it describes.
      #
      # The primary key is deliberately unique so it always misses and falls
      # through to the restore-key prefix, which resolves to the most recently
      # saved entry.
      - name: Restore previous data
        uses: actions/cache/restore@v6
        with:
          path: public/datastore
          key: estat-data-${{ github.run_id }}
          restore-keys: |
            estat-data-

      # Writes changed/save/cache-key, and its own run summary — including on the
      # failure path, so a red run never reports "no changes detected".
      - name: Check for new data
        id: watch
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: node scripts/estat-watch.mjs

      - name: Save data to cache
        if: steps.watch.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: public/datastore
          key: ${{ steps.watch.outputs.cache-key }}

  # Separate job so `actions: write` is nowhere near the one that processes a
  # third-party payload.
  prune:
    needs: check-updates
    if: needs.check-updates.outputs.save == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: write

    steps:
      # `actions/cache/save` warns rather than fails when the key already exists,
      # so a green save step is not proof the entry was written. Deleting
      # everything else on that assumption is how the last good entry gets
      # removed, leaving nothing for the next deploy to restore. So the keep-key
      # is confirmed to exist before anything is deleted.
      - name: Prune superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_KEY: ${{ needs.check-updates.outputs.cache-key }}
        run: |
          set -euo pipefail

          if ! gh cache list --key "$KEEP_KEY" --limit 1 --json key --jq '.[].key' | grep -qxF "$KEEP_KEY"; then
            echo "::warning::$KEEP_KEY was not written (duplicate key, or the save step failed). Skipping the prune so the existing entries survive."
            exit 0
          fi

          pruned=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh cache delete "$id"
            pruned=$((pruned + 1))
          done < <(gh cache list --key estat-data- --limit 100 --json id,key --jq ".[] | select(.key != \"$KEEP_KEY\") | .id")

          echo "::notice::Kept $KEEP_KEY, deleted $pruned superseded cache(s)."

  # Calls the deploy directly rather than dispatching it blindly, so a data
  # update is one linked run and the deploy reads the cache this run just saved.
  deploy:
    needs: check-updates
    if: needs.check-updates.outputs.changed == 'true'
    # The publish rights live here, on the only job that publishes. This is the
    # ceiling deploy.yaml's own job-level permissions are checked against.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      # Only the data moved. The commit being deployed is the one that already
      # passed lint, typecheck and test on its way into main, and none of those
      # three read data — re-running them here would verify nothing. The build
      # still runs, which is what catches a payload that fails its completeness
      # or reconciliation checks.
      skip-verify: true
    secrets: inherit
