name: Data Watcher

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:05 UTC (10:05 JST). The daily restore also bumps the cache's
    # last-accessed time, which is what keeps it from being evicted.
    - cron: '5 1 * * *'

# Not cancel-in-progress: this workflow's deploy job publishes to Pages, and
# cancelling the run mid-publish would interrupt it. A daily cron never needs
# pre-emption anyway.
concurrency:
  group: watcher
  cancel-in-progress: false

# pages/id-token are required here because a called workflow can never hold
# more permissions than its caller, and the deploy job below needs them.
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    env:
      DATA_PATH: public/datastore/statData.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore previous data
        uses: actions/cache/restore@v6
        with:
          path: public/datastore/statData.json
          key: estat-data-${{ github.run_id }}
          restore-keys: |
            estat-data-

      # force: true — always pull a fresh copy, preserving whatever was
      # restored as prev-statData.json so the two can be compared.
      - name: Download latest data
        id: fetch
        uses: ./.github/actions/fetch-estat-data
        with:
          app-id: ${{ secrets.ESTAT_APP_ID }}
          force: 'true'

      - name: Compare survey date
        id: diff
        env:
          HAD_PREVIOUS: ${{ steps.fetch.outputs.had-previous }}
          PREV_PATH: ${{ steps.fetch.outputs.previous-path }}
        run: |
          set -euo pipefail

          if [ "$HAD_PREVIOUS" != "true" ]; then
            echo "::notice::No previous payload (first run or cache evicted). Saving a baseline without deploying."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "save=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(jq -r '.GET_STATS_DATA.STATISTICAL_DATA.TABLE_INF.SURVEY_DATE' "$DATA_PATH")
          previous=$(jq -r '.GET_STATS_DATA.STATISTICAL_DATA.TABLE_INF.SURVEY_DATE' "$PREV_PATH")

          echo "Previous SURVEY_DATE: $previous"
          echo "Current  SURVEY_DATE: $current"

          if [ "$current" != "$previous" ]; then
            echo "::notice::SURVEY_DATE changed from $previous to $current"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No change (still $current)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      # Key derived from the payload's actual content, computed after the
      # download. The previous implementation called hashFiles() before the file
      # existed, which returns an empty string and collapsed the key to the bare
      # "estat-data-" prefix.
      - name: Compute cache key
        if: steps.diff.outputs.save == 'true'
        run: echo "DATA_KEY=estat-data-$(sha256sum "$DATA_PATH" | cut -c1-16)" >> "$GITHUB_ENV"

      - name: Save data to cache
        if: steps.diff.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: public/datastore/statData.json
          key: ${{ env.DATA_KEY }}

      - name: Prune superseded caches
        if: steps.diff.outputs.save == 'true'
        uses: actions/github-script@v9
        env:
          KEEP_KEY: ${{ env.DATA_KEY }}
        with:
          script: |
            const keep = process.env.KEEP_KEY;
            const stale = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                key: 'estat-data-',
                per_page: 100,
                page,
              });
              const batch = data.actions_caches ?? [];
              stale.push(...batch.filter((c) => c.key !== keep));
              if (batch.length < 100) break;
            }
            for (const cache of stale) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }
            core.info(`Kept ${keep}, deleted ${stale.length} superseded cache(s).`);

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### New data detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy has been triggered automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No changes detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Data is unchanged since the last check. No deploy triggered." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Checked at:** $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M:%S JST')" >> "$GITHUB_STEP_SUMMARY"

  # Replaces the previous blind createWorkflowDispatch, so a data update is one
  # linked run and the deploy reads the cache this run just saved.
  deploy:
    needs: check-updates
    if: needs.check-updates.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
