<!doctype html><meta charset="utf-8">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#f6f7f9; font-family:'Segoe UI',system-ui,sans-serif; color:#191a1f; display:flex; flex-direction:column; padding:64px 72px; position:relative; overflow:hidden; }
  .brand { display:flex; align-items:center; gap:18px; }
  .mark { width:64px; height:64px; border-radius:16px; background:#4f56d3; color:#fff; display:grid; place-items:center; font-size:30px; font-weight:800; }
  h1 { font-size:54px; letter-spacing:-0.02em; margin-top:36px; line-height:1.1; }
  p { font-size:26px; color:#4d5160; margin-top:16px; max-width:700px; }
  .sub { font-size:22px; color:#6d7285; }
  .bars { position:absolute; right:64px; bottom:0; display:flex; align-items:flex-end; gap:18px; height:300px; }
  .bar { width:54px; border-radius:8px 8px 0 0; }
  .chip { position:absolute; right:72px; top:64px; background:#fff; border:1px solid #e5e7ee; border-radius:999px; padding:10px 22px; font-size:20px; color:#4d5160; box-shadow:0 8px 24px -18px rgb(20 22 40 / .25); }
</style>
