<!-- @dsCard group="Data display" height=230 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DataReadout — preview</title></head>
<body>
<div class="cg-stage on-card" style="gap:20px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="cg-caption">Unified chart tooltip</span>
    <div class="cg-readout" role="status">
      <div class="title">May 2025</div>
      <div class="rows">
        <div class="r"><span class="k"><span class="cg-dot" style="background:var(--chart-1)"></span>Pending (carried over)</span><span class="v">396,555</span></div>
        <div class="r"><span class="k"><span class="cg-dot" style="background:var(--chart-2)"></span>Received</span><span class="v">616,506</span></div>
        <div class="r"><span class="k"><span class="cg-dot" style="background:var(--chart-3)"></span>Processed</span><span class="v">508,547</span></div>
        <div class="r"><span class="k"><span class="cg-dot" style="background:var(--chart-7)"></span>Approval rate</span><span class="v">95.5%</span></div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="cg-caption">Unified hover card</span>
    <div class="cg-readout" role="status">
      <div class="title" style="display:flex;align-items:center;gap:7px;font-weight:600"><span class="cg-dot" style="background:var(--bureau-shinagawa);width:9px;height:9px"></span>Shinagawa</div>
      <div class="rows">
        <div class="r"><span class="k">Received</span><span class="v">142,880</span></div>
        <div class="r"><span class="k">Processed</span><span class="v">131,204</span></div>
        <div class="r"><span class="k">Efficiency</span><span class="v">91.8%</span></div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="cg-caption">Today: labels at full ink</span>
    <div class="cg-readout today" role="status">
      <div class="title">May 2025</div>
      <div class="rows">
        <div class="r"><span class="k"><span class="cg-dot" style="background:var(--chart-1)"></span>Pending (carried over)</span><span class="v">396,555</span></div>
        <div class="r"><span class="k"><span class="cg-dot" style="background:var(--chart-2)"></span>Received</span><span class="v">616,506</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
