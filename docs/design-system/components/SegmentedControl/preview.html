<!-- @dsCard group="Selection" height=170 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl — preview</title></head>
<body>
<div class="cg-stage col on-card">
  <div class="cg-caption">Unified pill</div>
  <div class="cg-seg" role="group" aria-label="Choose which dataset to explore">
    <button aria-pressed="true">Application Processing</button>
    <button aria-pressed="false">Resident Population</button>
  </div>
  <div class="cg-seg" role="group" aria-label="Population Growth">
    <button aria-pressed="true">By purpose of stay</button>
    <button aria-pressed="false">By world region</button>
  </div>
  <div class="cg-caption">Today inside charts</div>
  <div class="cg-seg today-chart" role="group" aria-label="Biggest Movers">
    <button aria-pressed="true">By nationality</button>
    <button aria-pressed="false">By residence status</button>
  </div>
</div>
<script>
document.querySelectorAll('.cg-seg').forEach(function (group) {
  group.addEventListener('click', function (event) {
    var button = event.target.closest('button');
    if (!button || button.disabled) return;
    group.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
  });
});
</script>
</body>
</html>
