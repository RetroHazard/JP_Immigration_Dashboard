<!-- @dsCard group="Forms" height=230 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FilterField — preview</title></head>
<body>
<div class="cg-stage col on-card">
  <div class="cg-caption">Unified</div>
  <div class="cg-fieldgrid">
    <div class="cg-field"><label class="cg-eyebrow" for="f-bureau">Immigration bureau</label>
      <select id="f-bureau" class="cg-select"><option>Nationwide</option><option>Sapporo</option><option>Sendai</option><option>Shinagawa</option><option>Yokohama</option><option>Nagoya</option><option>Osaka</option><option>Kobe</option><option>Hiroshima</option><option>Takamatsu</option><option>Fukuoka</option><option>Naha</option></select></div>
    <div class="cg-field"><label class="cg-eyebrow" for="f-type">Application type</label>
      <select id="f-type" class="cg-select"><option>All types</option><option>Status Acquisition</option><option>Extension of Stay</option><option>Change of Status</option><option>Permission for Activities</option><option>Re-entry</option><option>Permanent Residence</option></select></div>
    <div class="cg-field"><label class="cg-eyebrow" for="f-status">Residence status</label>
      <select id="f-status" class="cg-select" disabled><option>All categories</option></select></div>
  </div>
  <div class="cg-caption">Today in the filter bar</div>
  <div class="cg-fieldgrid">
    <div class="cg-field"><label class="today" for="t-bureau">Immigration Bureau</label>
      <select id="t-bureau" class="cg-select today"><option>Nationwide</option></select></div>
    <div class="cg-field"><label class="today" for="t-type">Application Type</label>
      <select id="t-type" class="cg-select today"><option>All Types</option></select></div>
  </div>
</div>
</body>
</html>
