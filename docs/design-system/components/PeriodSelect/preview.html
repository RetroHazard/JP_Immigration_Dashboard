<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PeriodSelect — preview</title></head>
<body>
<div class="cg-stage on-card" style="justify-content:space-between">
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <button class="cg-trigger" aria-label="Time range">12 months<svg class="cg-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="cg-micro">Data: Nov 2020 – Oct 2025</span>
  </div>
  <div class="cg-menu" role="listbox" aria-label="Time range" style="width:160px">
    <div class="cg-menu-item" role="option">6 months</div>
    <div class="cg-menu-item" role="option" aria-selected="true">12 months<span class="check"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></div>
    <div class="cg-menu-item hl" role="option">24 months</div>
    <div class="cg-menu-item" role="option">36 months</div>
    <div class="cg-menu-item" role="option">All data</div>
  </div>
</div>
</body>
</html>
