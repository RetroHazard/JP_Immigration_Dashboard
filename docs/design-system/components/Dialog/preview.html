<!-- @dsCard group="Containers" height=360 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div class="cg-stage col">
  <div class="cg-scrim">
    <div class="cg-dialog" role="dialog" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Changelog</h2>
      <button class="close" aria-label="Close"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <div style="display:flex;justify-content:flex-end;padding-bottom:8px;margin-top:-8px;border-bottom:1px solid var(--border)">
        <button class="cg-disclosure" aria-expanded="false"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>Expand all</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="cg-month open"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>2026-09</div>
        <div class="cg-changes">
          <h4>Changed</h4>
          <ul>
            <li><strong>v1.6.3</strong>: Each month in this changelog is now a section you can fold away.</li>
            <li><strong>v1.6.2</strong>: A downloaded CSV is now named for what it contains.</li>
          </ul>
        </div>
        <div class="cg-month"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>2026-08</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
