<!-- @dsCard group="Actions" height=190 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div class="cg-stage col on-card">
  <div class="cg-caption">Unified: round, two sizes</div>
  <div class="cg-row">
    <button class="cg-iconbtn" aria-label="Language"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></button>
    <button class="cg-iconbtn" aria-label="Open the settings menu"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button>
    <button class="cg-iconbtn" aria-pressed="true" aria-label="Include airport offices"><span style="position:relative;display:flex;align-items:center;justify-content:center"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg><span class="strike"></span></span></button>
    <button class="cg-iconbtn" disabled aria-label="Reset filters"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <span style="width:12px"></span>
    <button class="cg-iconbtn ghost" aria-label="Reset the Processing Time Estimator"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="cg-iconbtn ghost" aria-label="Copy a permalink to this estimate"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
    <button class="cg-iconbtn ghost copied" aria-label="Copied"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
    <button class="cg-iconbtn ghost" aria-label="Collapse the Processing Time Estimator"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg></button>
    <button class="cg-iconbtn ghost cg-show-focus" aria-label="Close the estimator"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="cg-caption">Today in the filter bars</div>
  <div class="cg-row">
    <button class="cg-iconbtn today-square" aria-label="Exclude airport offices"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></button>
    <button class="cg-iconbtn today-square today-dim" disabled aria-label="Reset filters"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="cg-iconbtn today-md today-dim" disabled aria-label="Reset filters"><svg class="cg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
</div>
</body>
</html>
