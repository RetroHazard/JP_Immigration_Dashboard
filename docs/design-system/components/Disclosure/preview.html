<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Disclosure — preview</title></head>
<body>
<div class="cg-stage col on-card">
  <div class="cg-rule-top">
    <button class="cg-disclosure" aria-expanded="false"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>View data table</button>
  </div>
  <div class="cg-rule-top" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <button class="cg-disclosure" aria-expanded="true"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>Hide data table</button>
    <button class="cg-smallbtn"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>Download CSV</button>
  </div>
  <div class="cg-rule-top">
    <button class="cg-disclosure" aria-expanded="false"><svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>Show policy events</button>
  </div>
  <button class="cg-focusable" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:12px 0 0;border:0;border-top:1px dashed var(--border);background:none;font:inherit;font-size:12px;line-height:16px;cursor:pointer" aria-expanded="false">
    <span style="color:var(--secondary-foreground)">How is this calculated?</span>
    <span style="display:inline-flex;align-items:center;gap:2px;color:var(--muted-foreground)">Show the math<svg class="cg-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
  </button>
</div>
</body>
</html>
