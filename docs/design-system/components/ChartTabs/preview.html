<script>
document.querySelectorAll('.cg-tabs').forEach(function (list) {
  list.addEventListener('click', function (event) {
    var tab = event.target.closest('.cg-tab');
    if (!tab) return;
    var wide = !list.getAttribute('aria-label').includes('phone');
    list.querySelectorAll('.cg-tab').forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', String(on));
      var span = t.querySelector('span');
      if (wide) span.className = on ? 'label' : 'cg-sr';
    });
  });
});
</script>
